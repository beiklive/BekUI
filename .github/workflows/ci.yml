name: ci

# 本地门禁是 scripts/check.sh（命名 → 分层 → GL/VK 双后端零警告构建）。
# 这里把同一套检查拆成 CI 能并行的几块：静态检查一份，构建按 {平台 × 后端} 分份。
#
# 构建命令全部走 scripts/ci_build.sh，参数与「零警告才算过」的门禁只有那一份
# （警告门禁本身在 scripts/check_warnings.sh，Switch 那条也用它）；平台之间只差
# 「装什么依赖」和「用哪个生成器」：
#
#   · Linux    ubuntu-latest，GCC + Unix Makefiles；SDL3 静态构建要一堆 X11 /
#              Wayland / 音频 / DRM 开发包，Vulkan 只要 libvulkan-dev（构建不建设备、不跑 ICD）。
#   · macOS    macos-latest，AppleClang + Unix Makefiles；Vulkan 走 brew 的 molten-vk
#              + vulkan-headers/loader。
#   · Windows  windows-latest + MSYS2 MINGW64，Ninja —— 就是 build.bat 用的那套工具链，
#              显式 -G Ninja，否则 CMake 会挑机器上装的 Visual Studio 用 cl.exe 编。
#   · Windows  windows-latest + MSVC 2022，只编 GL：专门盯住 notes/tweeny-msvc-render.patch
#              这条**只在 MSVC 下生效**的路径（配置阶段自动打补丁）。这里不跑 Vulkan，
#              免得依赖 runner 上有没有 Vulkan SDK；Windows 的 vk 由上面的 MinGW job 覆盖。
#   · Switch   ubuntu-latest + devkitpro/devkita64 容器，scripts/build_switch.sh（GLES3）。
#
# 构建产物分目录（GL → dist/、VK → dist/vk/），每个 job 各占一台机器，不会互相覆盖 dist/。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: 静态检查（命名 / 分层）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 接口命名约定
        run: python3 scripts/check_naming.py
      - name: 分层依赖方向 + 伞头可达范围
        run: python3 scripts/check_layers.py

  linux:
    name: Linux · ${{ matrix.graphics }}
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        graphics: [gl, vk]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # SDL3 / Yoga / imgui / json / webp / lunasvg 都是 submodule，
      # 下面这些是 SDL3 在 Linux 上静态构建时要的系统开发包。
      - name: Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxi-dev libxcursor-dev \
            libxinerama-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Linux · Vulkan 头与 loader
        if: matrix.graphics == 'vk'
        run: sudo apt-get install -y --no-install-recommends libvulkan-dev

      - name: 构建（零警告）
        run: bash scripts/ci_build.sh ${{ matrix.graphics }}

  macos:
    name: macOS · ${{ matrix.graphics }}
    needs: static
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        graphics: [gl, vk]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 头文件装在 $(brew --prefix)/include、库在 $(brew --prefix)/lib，
      # 不在默认搜索路径里（Apple Silicon 是 /opt/homebrew），显式告诉 CMake。
      - name: macOS · Vulkan（MoltenVK + 头 + loader）
        if: matrix.graphics == 'vk'
        run: |
          brew install molten-vk vulkan-headers vulkan-loader
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: 构建（零警告）
        run: bash scripts/ci_build.sh ${{ matrix.graphics }}

  windows-mingw:
    name: Windows · MinGW-w64 · ${{ matrix.graphics }}
    needs: static
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        graphics: [gl, vk]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MSYS2 里的 cmake 是原生 Windows 程序，会把机器上装的 Visual Studio 当默认生成器，
      # 所以钉死 Ninja（与 build.bat 一致）。
      - name: 构建（零警告）
        env:
          BKLV_CMAKE_GENERATOR: Ninja
        run: bash scripts/ci_build.sh ${{ matrix.graphics }}

  windows-msvc:
    name: Windows · MSVC 2022 · gl
    needs: static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 用 MSYS2 之外的 git-bash：这里要的是 MSVC 工具链（VS 生成器自己去找 cl.exe），
      # 而 ci_build.sh 只是给三个平台共用参数与门禁，bash 只是 shell。
      - name: 构建（零警告）
        shell: bash
        env:
          BKLV_CMAKE_GENERATOR: Visual Studio 17 2022
          BKLV_BUILD_DIR: build/msvc-gl
        run: bash scripts/ci_build.sh gl

  switch:
    name: Switch · devkitA64 · gl
    needs: static
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      # 镜像是 devkitPro 的 aarch64 工具链，checkout 需要 git，镜像里不一定有。
      - name: 容器里补 git
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # build_switch.sh 不分后端（Switch 只有 GLES3），产物是 dist/switch/demo.nro。
      # 零警告门禁与另外几个 job 共用 scripts/check_warnings.sh。
      - name: 构建（零警告）
        run: |
          set -o pipefail
          ./scripts/build_switch.sh 2>&1 | tee build_switch.log
          if ! warnings="$(bash scripts/check_warnings.sh build_switch.log)"; then
            echo "::error::构建出现警告（约定是零警告）"
            printf '%s\n' "$warnings"
            exit 1
          fi
          ls -l dist/switch
