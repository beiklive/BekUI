name: switch

# Switch · GLES3（devkitPro 的 devkitA64 工具链，官方容器镜像）。
#
# Switch 不走 CMake：工具链与编译参数和桌面完全不同，且不能链接 SDL3，
# 唯一入口是 scripts/build_switch.sh，产物 dist/switch/bklv_switch.nro。
#
# 容器里没有 git（checkout 需要），所以先按需装一份；零警告门禁与桌面那几个
# workflow 共用 scripts/check_warnings.sh。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Switch · devkitA64
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - name: 容器里补 git
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 构建（零警告）
        run: |
          set -o pipefail
          ./scripts/build_switch.sh 2>&1 | tee build_switch.log
          if ! warnings="$(bash scripts/check_warnings.sh build_switch.log)"; then
            echo "::error::构建出现警告（约定是零警告）"
            printf '%s\n' "$warnings"
            exit 1
          fi
          ls -l dist/switch
